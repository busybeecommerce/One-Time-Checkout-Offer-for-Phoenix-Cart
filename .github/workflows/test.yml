name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
        phoenix: ['1.1.0.6', '1.1.0.8']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Checkout pinned Phoenix reference
        uses: actions/checkout@v4
        with:
          repository: CE-PhoenixCart/PhoenixCart
          ref: ${{ matrix.phoenix == '1.1.0.6' && '69ba8de85ec03c809a14f0bb2c7ca9fa5295a347' || '1c2161d0f1f605724efa058ecffe66f6f4bf0e55' }}
          path: reference
      - run: php tests/run.php reference
      - run: php tests/run.php reference --modal --styled
      - run: php tests/run.php reference --modal --template=red
      - run: php tests/run.php reference --modal --custom-text
      - run: php tests/admin_render.php reference install
      - run: php tests/admin_render.php reference setup
      - run: php tests/admin_render.php reference tier --currency-eur --finite-tier
      - run: php tests/admin_render.php reference tier --currency-jpy --finite-tier
      - run: php tests/admin_render.php reference tier --without-uncategorised
      - run: php tests/admin_render.php reference tier
      - run: node --test tests/storefront.test.js
      - run: node --check ext/checkout_offer/checkout_offer.js
      - run: node --check ext/checkout_offer/checkout_offer_admin.js
      - run: git diff --check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/checkout@v4
        with:
          repository: CE-PhoenixCart/PhoenixCart
          ref: 1c2161d0f1f605724efa058ecffe66f6f4bf0e55
          path: reference
      - run: npm install --no-save --package-lock=false playwright@1.62.1 bootstrap@5.3.8
      - run: npx playwright install --with-deps chromium
      - run: php tests/run.php reference --render
      - run: php tests/run.php reference --render --custom-text
      - run: php tests/run.php reference --render --modal --styled
      - run: php tests/run.php reference --render --modal --custom-text
      - run: node tests/browser.cjs
      - run: php tests/admin_render.php reference install
      - run: php tests/admin_render.php reference setup
      - run: php tests/admin_render.php reference tier --currency-eur --finite-tier
      - run: php tests/admin_render.php reference tier --currency-jpy --finite-tier
      - run: php tests/admin_render.php reference tier --without-uncategorised
      - run: php tests/admin_render.php reference tier
      - run: node tests/admin_browser.cjs
      - run: |
          for template in red honey midnight green ocean plum slate coral teal champagne; do
            php tests/run.php reference --render --template=$template
            php tests/run.php reference --render --modal --template=$template
          done
      - run: node tests/templates_browser.cjs
      - run: node tests/alignment_browser.cjs

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [php, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify release from tested main
        shell: pwsh
        run: ./scripts/build_package.ps1 -Version 1.7.21
      - name: Publish ZIP and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.7.21 \
            build/One-Time-Checkout-Offer-for-Phoenix-Cart-1.7.21.zip \
            build/One-Time-Checkout-Offer-for-Phoenix-Cart-1.7.21.zip.sha256.txt \
            --target "$GITHUB_SHA" --title "v1.7.21 — Display help and percentage precision" \
            --notes "Update setup guidance when switching inline/modal display. Use two decimal places for percentage fields. Clarify and test priority 21 versus 1, eligible ranges and accepted-tier locking. PHP/browser CI passed; package verified. No live deployment."
